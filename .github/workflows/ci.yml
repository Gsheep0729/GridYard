# GridYard 持续集成：镜像开发机工具链（g++-15 + CMake==4.2.3 + Qt 6.11.1）做配置构建、
# 串行全量 ctest 与守卫三脚本。ctest 严禁 -j 并行：UDP 45678 发现端口串扰已有实证（开发心得第 66 章）。
# CMake 必须固定 4.2.3：工程启用 C++23 import std，其实验特性 UUID 按 CMake 版本硬编码
# （src/CMakeLists.txt:5 为 4.2 的 UUID），CMake 版本漂移会让 import std 检测失效。
name: CI

on:
  push:
    branches: [gy, dev]
  pull_request:
    branches: [gy, dev]

jobs:
  build-and-test:
    # 显式固化 runner（runner-images 现行 ubuntu-latest 指向 24.04），防镜像漂移
    # 破坏已验证工具链；26.04 迁移按 runner-images 公告另行跟进
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # 仅取证步骤用：失败日志回推 gy（[skip ci] 防触发环）
    steps:
      - name: 检出代码
        # node20 运行时已被弃用，checkout v5 起迁移 node24；锁当前稳定版 v7.0.1
        uses: actions/checkout@v7.0.1

      - name: 安装系统依赖与 g++-15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-15 \
            libgl1-mesa-dev libegl1-mesa-dev libopengl-dev \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0
          # 隔离脚本 --compile-check 字面调用 g++，指向 15 保持 C++23 检查口径与本机一致
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100

      - name: 安装 CMake 与 Qt 6.11.1
        run: |
          # run#1~#4 连红于本步骤的实证根因（本机 aqt 复现，run 40246936309/
          # 40261519610/40262347519）：Qt 6.11 元数据两处变化——①arch 名
          # gcc_64 已废，只认 linux_gcc_64（旧参数直接报错退出）；②qtsvg/
          # qtimageformats/qtshadertools 已并入基础发行包，元数据无可选模块
          # （带 -m 必失败；本机 ldd 实证产品零 Svg/ShaderTools 链接依赖）。
          # 落盘目录仍归一化为 <O>/6.11.1/gcc_64。另：pipx 预装与 /opt 直写
          # 不再假设（ubuntu-latest 迁移 26.04，runner-images#14748）。
          command -v pipx >/dev/null 2>&1 || sudo apt-get install -y pipx
          pipx install cmake==4.2.3 || pipx install cmake==4.2.3
          pipx install aqtinstall || pipx install aqtinstall
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          aqt install-qt linux desktop 6.11.1 linux_gcc_64 -O "$HOME/Qt" \
            || aqt install-qt linux desktop 6.11.1 linux_gcc_64 -O "$HOME/Qt"
          echo "$HOME/Qt/6.11.1/gcc_64/bin" >> "$GITHUB_PATH"

      - name: 配置与构建
        run: |
          set -o pipefail
          cmake -S src -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.11.1/gcc_64" 2>&1 | tee /tmp/cfg.log | tail -3 \
            || { # 注解是无凭据取证的唯一可读通道（日志 403/页面登录墙/回推被拒）
                 grep -B3 -A8 "CMake Error" /tmp/cfg.log | head -8 > /tmp/ann.txt
                 [ -s /tmp/ann.txt ] || tail -8 /tmp/cfg.log > /tmp/ann.txt
                 while IFS= read -r line; do echo "::error::${line:0:400}"; done < /tmp/ann.txt
                 exit 1; }
          cmake --build build-ci -j"$(nproc)" 2>&1 | tee /tmp/build.log | tail -3 \
            || { grep -E "error:|FAILED:" /tmp/build.log | head -8 > /tmp/ann.txt
                 while IFS= read -r line; do echo "::error::${line:0:400}"; done < /tmp/ann.txt
                 exit 1; }

      - name: 串行全量 ctest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          ctest --test-dir build-ci --output-on-failure 2>&1 | tee /tmp/ctest.log

      - name: 守卫三脚本
        run: |
          python3 src/scripts/check_versions.py
          python3 src/scripts/check_code_style.py
          python3 src/scripts/check_core_isolation.py --core-dirs src/core src/shared/net/core --strict --compile-check

      - name: 失败日志回推取证
        if: failure()
        run: |
          # 宿主日志下载需 admin 凭据（API 403）、Run 页面需登录——公共通道
          # 全堵时把失败尾帧提交回 gy 供无凭据读取；[skip ci] 防触发环
          { echo "=== configure tail ==="; tail -80 /tmp/cfg.log 2>/dev/null
            echo "=== build errors ==="; grep -E "error:|FAILED:" /tmp/build.log 2>/dev/null | head -60
            echo "=== ctest tail ==="; tail -40 /tmp/ctest.log 2>/dev/null; } > ci-failure.log
          git config user.name "ci-forensics"
          git config user.email "ci-forensics@users.noreply.github.com"
          git add ci-failure.log
          git commit -m "CI 失败日志取证 [skip ci]"
          git push origin HEAD:gy

  # ====================================================================
  # Windows 可行性尖兵 job（报告§五 diff 预案落地，2026-11-01；只产出可行性证据，不是门禁）
  # 只读盘点结论（2026-11-01）决定了本 job 的三处降级（报告§五预案注释 A/B/C）：
  #  A) 全 src/ 零 _WIN32/winsock 分支（报告 B6：git 面 grep 复核 0 命中），16 文件直接
  #     include arpa/inet.h 等 POSIX 头 → appGridYard、gy_net_core、test_utils/port.h 与
  #     多数网络测试在 MSVC 下必然编译失败。故先按 --target 只构建纯 C++ 面
  #     （gy_core / gy_storage_core / sqlite3_vendor 及纯存储/编解码测试），
  #     全量构建待 POSIX 抽象层落地后放开。
  #  B) import std（src/CMakeLists.txt:5 的 CMake 4.2 UUID + :8 CMAKE_CXX_MODULE_STD）
  #     实验键与编译器无关，但 MSVC 工具集被 CMake 4.2.3 的 import std 检测接受与否未实测
  #     （报告§3.2"未执行项"）。首跑取证（run 41313929185 / b7ac7eb）：step 4「配置与构建」
  #     22s 失败 exit 1，与§5.2 预测的"VS 生成器不支持 import std"首跑形态一致——日志原文
  #     被凭据墙挡死（API 日志端点 403 admin-only、网页匿名态显示 Sign in to view logs），
  #     但四目标依赖闭包已实核零 POSIX 面（gy_shared 仅 protocol.h 不链 gy_net_core），
  #     22s 也排除配置成功后进入编译（sqlite3 融合文件单编译即 ≥10s）→ 本版按§5.2 执行
  #     预案切第二跳：Ninja 生成器 + msvc-dev-cmd（§3.2 四前提），CMake 4.2.3 钉版不变。
  #     第 2 轮取证（run 41320557061 / b5bc0d1）：Ninja+msvc-dev-cmd 生效——配置+构建 64s 通过，
  #     点 B 落地成功（CMake 4.2.3+Ninja+MSVC 工具集接受 import std，§3.1/§5.2 的张力落定）；
  #     但 step7 ctest 1801s exit 8，6 例全部命中各自 300s 超时（Linux 基线同过滤 6 例全过
  #     共 ~1.1s，本机实测），windeployqt 步骤 0s 空转（started==completed 同秒）——进程未完成
  #     任何一次运行，属部署/启动环境层而非产品断言失败。本版修 DLL/插件部署面（--release+
  #     落盘自检+qoffscreen 显式补齐+QT_PLUGIN_PATH 兜底）、构建切 Release 对齐 release-only
  #     Qt，ctest 逐例状态注入注解供下轮匿名取证。
  #  C) check_core_isolation --compile-check 字面调用 g++（src/scripts/check_core_isolation.py:233，
  #     报告 B14）→ windows 侧降级为仅扫描防线；防线5 ldd/nm（:302,310）因 build-ninja
  #     不存在自动 SKIP（报告 B15），不会误报。
  # ====================================================================
  windows-build-and-test:
    # 钉 windows-2022：Qt arch win64_msvc2022_64 对应 VS2022 工具集（报告§5.1.8 钉版理由），
    # 与 linux 侧 ubuntu-24.04 的防漂移哲学一致（本文件 :15-17）；转正时按 runner-images 公告换版
    runs-on: windows-2022
    continue-on-error: true   # A/B/C 解除前不作为门禁，仅产出可行性证据
    steps:
      - name: 检出代码
        # 与 linux job 同锁 v7.0.1（本文件 :22-23：node20 运行时已弃用，v5 起迁 node24）
        uses: actions/checkout@v7.0.1

      - name: 安装 CMake 4.2.3 与 Qt 6.11.1
        shell: bash
        run: |
          # aqt 决定（报告§1.3.1 取证修正 diff 原文）：PyPI aqt 3.3.0 装 Qt 6.11.x windows
          # 实测必失败——Qt CDN 已把 6.11.x windows 元数据改 per-arch 目录布局（§1.1.3-4 本机
          # curl 逐版本复现），故钉上游修复 commit 076e1659 以 git+https 安装（§1.1.5 实测
          # list-qt 成功；PyPI 至 2026-11-01 仍是 3.3.0，修复未发版）。Qt 版本保持 6.11.1；
          # arch 名按 §1.2 实测矩阵取 win64_msvc2022_64（diff 占位 windows_msvc2022_64 系
          # 未经实测的猜测写法；§5.1.3 的 list-qt 核对 TODO 已由该实测闭环）。
          # pipx 在 windows runner 的预装未验证，改用 python -m pip（同为 PyPI 源，§5.1.4）。
          python -m pip install --user cmake==4.2.3 \
            "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          # pip --user 的脚本目录在 Windows 不是 ~/.local/bin（Linux 惯例），而是
          # %APPDATA%\Python\PythonXY\Scripts：由 Python 侧自行报出（nt_user scheme），不猜版本号。
          # GITHUB_PATH 只对后续步骤生效，本步骤内另 export 供下方 aqt 立即可调用；
          # command -v 自检保证"装了就能被调用"，装而不达当场失败，不留到后续步骤才炸。
          pip_scripts="$(python -c "import sysconfig, sys; print(sysconfig.get_path('scripts', 'nt_user' if sys.platform == 'win32' else 'posix_user'))")"
          echo "$pip_scripts" >> "$GITHUB_PATH"
          export PATH="$(cygpath -u "$pip_scripts"):$PATH"
          command -v cmake && command -v aqt
          # diff 原文照抄 linux job 的 `|| 重复一次` 防抖写法，本版合并为一次：§1.3.1 这类
          # "元数据必失败"的根因重试无意义，一次干净失败更利于 continue-on-error 取证
          aqt install-qt windows desktop 6.11.1 win64_msvc2022_64 -O "$HOME/Qt"
          # 落盘目录名按 linux 侧先例（本文件 :43：arch 参数 linux_gcc_64 → 落盘 gcc_64，
          # 归一化由 Qt 包内布局决定）取 msvc2022_64；§5.1.3 注明 windows 侧归一化未逐项验证，
          # 下方自检兜底：目录不存在就列出实际结构并失败，便于取证而非后续步骤报"找不到 exe"
          qt_bin="$HOME/Qt/6.11.1/msvc2022_64/bin"
          [ -d "$qt_bin" ] || { echo "::error::Qt 落盘目录与预期不符，实际内容："; ls "$HOME/Qt/6.11.1"; exit 1; }
          echo "$qt_bin" >> "$GITHUB_PATH"

      - name: 激活 MSVC 环境
        # §5.2 第二跳：Ninja + cl 需先注入 MSVC 环境（报告§3.2 前提4）；arch x64 对齐 win64_msvc2022_64；
        # 钉 v1.13.0（上游 latest release，2024-01-01），与 checkout 钉版哲学一致
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: 配置与构建（纯 C++ 目标先行）
        shell: bash
        run: |
          set -o pipefail
          # Ninja 预装于 windows runner（报告§3.2 前提3）；万一镜像漂移则 pip 兜底（脚本目录已在 PATH）
          command -v ninja || python -m pip install --user ninja
          # §5.2 第二跳落地：-G Ninja（import std 在 MSVC 上仅 Ninja 支持，首跑 VS 生成器已在
          # run 41313929185 取证失败）；第 2 轮该配置 64s 通过（run 41320557061）——点 B 取证成功。
          # CMAKE_BUILD_TYPE=Release：aqt 在线 base 包按官方口径 release-only（无 Qt6Cored.dll；
          # Updates.xml 本机网络不可达未能直接验证，第 2 轮 --debug 部署 0 产出为旁证），
          # Debug(/MDd) exe 混 release Qt DLL 属 MSVC 不推荐组合，且 debug CRT 断言在 CI 会弹
          # 模态框挂满 300s 超时（第 2 轮 6/6 恰 300s 的候选形态之一），统一 Release 消除该类。
          # 注解取证移植自 linux job（本文件 :61-64）：日志原文网页需登录、API 需凭据，
          # ::error:: 注解是匿名可读的唯一通道
          cmake -S src -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.11.1/msvc2022_64" 2>&1 | tee /tmp/win-cfg.log | tail -3 \
            || { grep -B3 -A8 "CMake Error" /tmp/win-cfg.log | head -8 > /tmp/win-ann.txt
                 [ -s /tmp/win-ann.txt ] || tail -8 /tmp/win-cfg.log > /tmp/win-ann.txt
                 while IFS= read -r line; do echo "::error::${line:0:400}"; done < /tmp/win-ann.txt
                 exit 1; }
          # TODO(尖兵)：目标面按 A 的解除进度逐步扩大；目标名实核：gy_core →
          # src/core/CMakeLists.txt:5、gy_storage_core → src/core/storage/CMakeLists.txt:6、
          # sqlite3_vendor → third_party/sqlite/CMakeLists.txt:9、test_frame_codec →
          # src/tests/CMakeLists.txt:83、test_storage_database → :25、test_storage_device → :33、
          # test_storage_message → :50、test_storage_transfer_history → :68、test_database_worker → :537
          # （单配置生成器无需 --config）。测试面与下方 ctest -R 的 6 例命中严格对齐——
          # 核对员问题 1：若只建 test_frame_codec，其余 5 例在 ctest 必 Not Run 污染取证
          # （本机实证 build-ninja/tests/CTestTestfile.cmake:7 add_test 的 COMMAND 生成期已展开
          #  为完整 exe 路径，未构建即找不到 exe）。5 个存储/worker 测试的编译源集（各 test cpp +
          #  application_paths/local_data_broker/database_worker.cpp + core/storage）本机 grep
          #  零 POSIX 头、零 port.h/wait.h/posix_ 助手引用，属 A 降级边界内的纯存储面；
          #  注：报告 B7 称链 gy_test_utils 的用例 MSVC 必失败，但三者实际仅引 db_seed.h
          #  （→ client/domain/history_records.h + core/storage，均纯净），port.h 当前全仓
          #  零 include，B7 对这三个用例不成立；若真机仍曝 test_utils 编译错则属产品面另案
          cmake --build build-win \
            --target gy_core gy_storage_core sqlite3_vendor \
            test_frame_codec test_storage_database test_storage_device \
            test_storage_message test_storage_transfer_history test_database_worker \
            2>&1 | tee /tmp/win-build.log | tail -3 \
            || { grep -E "error C[0-9]+|fatal error|error:|FAILED:" /tmp/win-build.log | head -8 > /tmp/win-ann2.txt
                 while IFS= read -r line; do echo "::error::${line:0:400}"; done < /tmp/win-ann2.txt
                 exit 1; }
          # TODO(尖兵)：POSIX 抽象层落地后放开全量（报告 B3-B7）：
          # cmake --build build-win

      - name: windeployqt 摆 DLL 与平台插件
        shell: bash
        run: |
          # 33 个测试均为 qt_add_executable，Windows 无 rpath：Qt6*.dll 与平台插件需就位（报告 B19）。
          # 第 2 轮实证（run 41320557061）：本步骤 0s 空转（started==completed 同秒）、--debug 未产出
          # 任何 DLL，ctest 6 例全部 300s 超时（1801s≈6×300s；Linux 基线同过滤 6 例全过共 ~1.1s）。
          # aqt 在线 base 包按官方口径 release-only（无 Qt6Cored.dll 供 --debug 部署；Updates.xml
          # 本机不可达未能直接验证，以落盘自检兜底）→ 改 --release 并加三道自检，杜绝静默空转
          exe_count=$(find build-win/tests -name "*.exe" | wc -l)
          [ "$exe_count" -ge 6 ] || { echo "::error::build-win/tests 仅见 $exe_count 个测试 exe（应 6），构建产物布局异常"; exit 1; }
          find build-win/tests -name "*.exe" | while read -r exe; do
            "$HOME/Qt/6.11.1/msvc2022_64/bin/windeployqt.exe" --release --no-translations "$exe" \
              || echo "::warning::windeployqt 失败（QT_PLUGIN_PATH 兜底仍在）：$exe"
          done
          # offscreen 平台插件不在 windeployqt 默认部署面（§5.1.6 未实测项），显式补齐到各 exe 目录
          find build-win/tests -name "*.exe" | while read -r exe; do
            mkdir -p "$(dirname "$exe")/platforms"
            cp -f "$HOME/Qt/6.11.1/msvc2022_64/plugins/platforms/qoffscreen.dll" "$(dirname "$exe")/platforms/" \
              || echo "::warning::qoffscreen.dll 拷贝失败：$exe（QT_PLUGIN_PATH 兜底仍在）"
          done
          # 部署自检：任一测试 exe 目录缺 Qt6Core.dll 即失败——第 2 轮的静默空转不允许再发生
          find build-win/tests -name "*.exe" | while read -r exe; do
            [ -f "$(dirname "$exe")/Qt6Core.dll" ] || { echo "::error::$(dirname "$exe") 缺 Qt6Core.dll，DLL 部署未生效"; exit 1; }
          done

      - name: 串行 ctest（严禁 -j：UDP 45678 串扰，同顶部 linux job 注释）
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -o pipefail
          # §5.1.6 预案的插件兜底：即使 windeployqt 漏部署，也从 aqt 安装树直取平台插件
          export QT_PLUGIN_PATH="$HOME/Qt/6.11.1/msvc2022_64/plugins"
          # 首轮仅跑纯存储/编解码面（报告 B20：网络类待 A 解除后纳入）；
          # -R 过滤实核命中 6 例：test_storage_database/device/message/transfer_history、
          # test_frame_codec、test_database_worker（src/tests/CMakeLists.txt:36,52,66,80,87,548），
          # 与上方 --target 构建面严格对齐（6 个测试 exe 全部先建，无 Not Run 污染）；
          # 串行依据 protocol.h:44 kDefaultDiscoveryPort=45678 + 8 个绑定 UDP 的用例
          # （报告 B18、§5.1.7），沿用 ctest 默认串行，绝不加 -j；
          # 失败时逐例状态（Passed/Failed/Timeout/Not Run）注入 ::error:: 注解——第 2 轮
          # exit 8 无任何用例名可读，本注解让下轮死因匿名可读（本机实测 ctest 失败退出码=8）
          ctest --test-dir build-win --output-on-failure \
            -R "test_storage_|test_database_worker|test_frame_codec" 2>&1 | tee /tmp/win-ctest.log | tail -8 \
            || { grep -E "Passed|Failed|Timeout|Not Run|tests passed|tests failed" /tmp/win-ctest.log \
                   | head -10 > /tmp/win-ann3.txt
                 while IFS= read -r line; do echo "::error::${line:0:400}"; done < /tmp/win-ann3.txt
                 exit 1; }
          # TODO(尖兵)：全量串行 ctest 回归；转绿后按实测放宽超时（报告 B21）

      - name: 守卫（windows 可跑部分）
        env:
          PYTHONUTF8: "1"   # 脚本输出含 ✅/❌ 与中文，Windows 管道 cp1252/cp936 会 UnicodeEncodeError（报告 B17）
        shell: bash
        run: |
          # check_versions 纯 stdlib（报告 B16）、check_code_style 纯 stdlib 正则（报告 B17）→ 直跑
          python src/scripts/check_versions.py
          python src/scripts/check_code_style.py
          # 降级：--compile-check 字面调用 g++（src/scripts/check_core_isolation.py:233，报告 B14，
          # windows runner 无 g++ → FileNotFoundError），windows 侧只跑扫描防线并保持 --strict；
          # 防线5 ldd/nm（:302,310）检查的是 build-ninja/rendezvous/gridyard_rendezvous，
          # 本 job 构建目录是 build-win → 自动 SKIP 不误报（报告 B15）
          python src/scripts/check_core_isolation.py --core-dirs src/core src/shared/net/core --strict
          # TODO：choco install mingw 后恢复 --compile-check，或把该层参数化编译器后放开

