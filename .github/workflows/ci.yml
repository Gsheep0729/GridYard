# GridYard 持续集成：镜像开发机工具链（g++-15 + CMake==4.2.3 + Qt 6.11.1）做配置构建、
# 串行全量 ctest 与守卫三脚本。ctest 严禁 -j 并行：UDP 45678 发现端口串扰已有实证（开发心得第 66 章）。
# CMake 必须固定 4.2.3：工程启用 C++23 import std，其实验特性 UUID 按 CMake 版本硬编码
# （src/CMakeLists.txt:5 为 4.2 的 UUID），CMake 版本漂移会让 import std 检测失效。
name: CI

on:
  push:
    branches: [gy, dev]
  pull_request:
    branches: [gy, dev]

jobs:
  build-and-test:
    # 显式固化 runner（runner-images 现行 ubuntu-latest 指向 24.04），防镜像漂移
    # 破坏已验证工具链；26.04 迁移按 runner-images 公告另行跟进
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # 仅取证步骤用：失败日志回推 gy（[skip ci] 防触发环）
    steps:
      - name: 检出代码
        # node20 运行时已被弃用，checkout v5 起迁移 node24；锁当前稳定版 v7.0.1
        uses: actions/checkout@v7.0.1

      - name: 安装系统依赖与 g++-15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-15 \
            libgl1-mesa-dev libegl1-mesa-dev libopengl-dev \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0
          # 隔离脚本 --compile-check 字面调用 g++，指向 15 保持 C++23 检查口径与本机一致
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100

      - name: 安装 CMake 与 Qt 6.11.1
        run: |
          # run#1~#4 连红于本步骤的实证根因（本机 aqt 复现，run 40246936309/
          # 40261519610/40262347519）：Qt 6.11 元数据两处变化——①arch 名
          # gcc_64 已废，只认 linux_gcc_64（旧参数直接报错退出）；②qtsvg/
          # qtimageformats/qtshadertools 已并入基础发行包，元数据无可选模块
          # （带 -m 必失败；本机 ldd 实证产品零 Svg/ShaderTools 链接依赖）。
          # 落盘目录仍归一化为 <O>/6.11.1/gcc_64。另：pipx 预装与 /opt 直写
          # 不再假设（ubuntu-latest 迁移 26.04，runner-images#14748）。
          command -v pipx >/dev/null 2>&1 || sudo apt-get install -y pipx
          pipx install cmake==4.2.3 || pipx install cmake==4.2.3
          pipx install aqtinstall || pipx install aqtinstall
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          aqt install-qt linux desktop 6.11.1 linux_gcc_64 -O "$HOME/Qt" \
            || aqt install-qt linux desktop 6.11.1 linux_gcc_64 -O "$HOME/Qt"
          echo "$HOME/Qt/6.11.1/gcc_64/bin" >> "$GITHUB_PATH"

      - name: 配置与构建
        run: |
          set -o pipefail
          cmake -S src -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.11.1/gcc_64" 2>&1 | tee /tmp/cfg.log | tail -3 \
            || { # 注解是无凭据取证的唯一可读通道（日志 403/页面登录墙/回推被拒）
                 grep -B3 -A8 "CMake Error" /tmp/cfg.log | head -8 > /tmp/ann.txt
                 [ -s /tmp/ann.txt ] || tail -8 /tmp/cfg.log > /tmp/ann.txt
                 while IFS= read -r line; do echo "::error::${line:0:400}"; done < /tmp/ann.txt
                 exit 1; }
          cmake --build build-ci -j"$(nproc)" 2>&1 | tee /tmp/build.log | tail -3 \
            || { grep -E "error:|FAILED:" /tmp/build.log | head -8 > /tmp/ann.txt
                 while IFS= read -r line; do echo "::error::${line:0:400}"; done < /tmp/ann.txt
                 exit 1; }

      - name: 串行全量 ctest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          ctest --test-dir build-ci --output-on-failure 2>&1 | tee /tmp/ctest.log

      - name: 守卫三脚本
        run: |
          python3 src/scripts/check_versions.py
          python3 src/scripts/check_code_style.py
          python3 src/scripts/check_core_isolation.py --core-dirs src/core src/shared/net/core --strict --compile-check

      - name: 失败日志回推取证
        if: failure()
        run: |
          # 宿主日志下载需 admin 凭据（API 403）、Run 页面需登录——公共通道
          # 全堵时把失败尾帧提交回 gy 供无凭据读取；[skip ci] 防触发环
          { echo "=== configure tail ==="; tail -80 /tmp/cfg.log 2>/dev/null
            echo "=== build errors ==="; grep -E "error:|FAILED:" /tmp/build.log 2>/dev/null | head -60
            echo "=== ctest tail ==="; tail -40 /tmp/ctest.log 2>/dev/null; } > ci-failure.log
          git config user.name "ci-forensics"
          git config user.email "ci-forensics@users.noreply.github.com"
          git add ci-failure.log
          git commit -m "CI 失败日志取证 [skip ci]"
          git push origin HEAD:gy

  # ====================================================================
  # Windows 可行性尖兵 job（报告§五 diff 预案落地，2026-11-01；只产出可行性证据，不是门禁）
  # 只读盘点结论（2026-11-01）决定了本 job 的三处降级（报告§五预案注释 A/B/C）：
  #  A) 全 src/ 零 _WIN32/winsock 分支（报告 B6：git 面 grep 复核 0 命中），16 文件直接
  #     include arpa/inet.h 等 POSIX 头 → appGridYard、gy_net_core、test_utils/port.h 与
  #     多数网络测试在 MSVC 下必然编译失败。故先按 --target 只构建纯 C++ 面
  #     （gy_core / gy_storage_core / sqlite3_vendor 及纯存储/编解码测试），
  #     全量构建待 POSIX 抽象层落地后放开。
  #  B) import std（src/CMakeLists.txt:5 的 CMake 4.2 UUID + :8 CMAKE_CXX_MODULE_STD）
  #     实验键与编译器无关，但 MSVC 工具集被 CMake 4.2.3 的 import std 检测接受与否未实测
  #     （报告§3.2"未执行项"）。首跑取证（run 41313929185 / b7ac7eb）：step 4「配置与构建」
  #     22s 失败 exit 1，与§5.2 预测的"VS 生成器不支持 import std"首跑形态一致——日志原文
  #     被凭据墙挡死（API 日志端点 403 admin-only、网页匿名态显示 Sign in to view logs），
  #     但四目标依赖闭包已实核零 POSIX 面（gy_shared 仅 protocol.h 不链 gy_net_core），
  #     22s 也排除配置成功后进入编译（sqlite3 融合文件单编译即 ≥10s）→ 本版按§5.2 执行
  #     预案切第二跳：Ninja 生成器 + msvc-dev-cmd（§3.2 四前提），CMake 4.2.3 钉版不变。
  #     第 2 轮取证（run 41320557061 / b5bc0d1）：Ninja+msvc-dev-cmd 生效——配置+构建 64s 通过，
  #     点 B 落地成功（CMake 4.2.3+Ninja+MSVC 工具集接受 import std，§3.1/§5.2 的张力落定）；
  #     但 step7 ctest 1801s exit 8，6 例全部命中各自 300s 超时（Linux 基线同过滤 6 例全过
  #     共 ~1.1s，本机实测），windeployqt 步骤 0s 空转（started==completed 同秒）——进程未完成
  #     任何一次运行，属部署/启动环境层而非产品断言失败。本版修 DLL/插件部署面（--release+
  #     落盘自检+qoffscreen 显式补齐+QT_PLUGIN_PATH 兜底）、构建切 Release 对齐 release-only
  #     Qt，ctest 逐例状态注入注解供下轮匿名取证。
  #  C) check_core_isolation --compile-check 字面调用 g++（src/scripts/check_core_isolation.py:233，
  #     报告 B14）→ windows 侧降级为仅扫描防线；防线5 ldd/nm（:302,310）因 build-ninja
  #     不存在自动 SKIP（报告 B15），不会误报。
  # --------------------------------------------------------------------
  # 第 8 轮（2026-11-03，#32 全绿定局后）：M2a-d 网络栈 Windows 分支四批落账（shared/net/core
  # 三文件、client/network 六文件、入口 WSAStartup/WSACleanup、test_utils/port.h 回环套接字对），
  # A 降级的前提（全 src/ 零 _WIN32 分支）解除——构建面从 9 目标白名单放开全树（ninja -k 0
  # 收齐失译清单），ctest 从 6 例过滤放开全量 33 例串行，windeployqt 步测试 exe 名单改从
  # tests/CTestTestfile.cmake 全量推导（33 例，随用例增删自动跟走）。B 已由第 2 轮定案，
  # C 维持降级。本阶段定位：Windows 全量构建+ctest 首次真取证；产品码修复仅限失败取证
  # 指到的文件。run 级结论仍是 continue-on-error 假象，一切以 job 级结论与注解为准。
  # ====================================================================
  windows-build-and-test:
    # 钉 windows-2022：Qt arch win64_msvc2022_64 对应 VS2022 工具集（报告§5.1.8 钉版理由），
    # 与 linux 侧 ubuntu-24.04 的防漂移哲学一致（本文件 :15-17）；转正时按 runner-images 公告换版
    runs-on: windows-2022
    continue-on-error: true   # A/B/C 解除前不作为门禁，仅产出可行性证据
    steps:
      - name: 检出代码
        # 与 linux job 同锁 v7.0.1（本文件 :22-23：node20 运行时已弃用，v5 起迁 node24）
        uses: actions/checkout@v7.0.1

      - name: 安装 CMake 4.2.3 与 Qt 6.11.1
        shell: bash
        run: |
          # aqt 决定（报告§1.3.1 取证修正 diff 原文）：PyPI aqt 3.3.0 装 Qt 6.11.x windows
          # 实测必失败——Qt CDN 已把 6.11.x windows 元数据改 per-arch 目录布局（§1.1.3-4 本机
          # curl 逐版本复现），故钉上游修复 commit 076e1659 以 git+https 安装（§1.1.5 实测
          # list-qt 成功；PyPI 至 2026-11-01 仍是 3.3.0，修复未发版）。Qt 版本保持 6.11.1；
          # arch 名按 §1.2 实测矩阵取 win64_msvc2022_64（diff 占位 windows_msvc2022_64 系
          # 未经实测的猜测写法；§5.1.3 的 list-qt 核对 TODO 已由该实测闭环）。
          # pipx 在 windows runner 的预装未验证，改用 python -m pip（同为 PyPI 源，§5.1.4）。
          python -m pip install --user cmake==4.2.3 \
            "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          # pip --user 的脚本目录在 Windows 不是 ~/.local/bin（Linux 惯例），而是
          # %APPDATA%\Python\PythonXY\Scripts：由 Python 侧自行报出（nt_user scheme），不猜版本号。
          # GITHUB_PATH 只对后续步骤生效，本步骤内另 export 供下方 aqt 立即可调用；
          # command -v 自检保证"装了就能被调用"，装而不达当场失败，不留到后续步骤才炸。
          pip_scripts="$(python -c "import sysconfig, sys; print(sysconfig.get_path('scripts', 'nt_user' if sys.platform == 'win32' else 'posix_user'))")"
          echo "$pip_scripts" >> "$GITHUB_PATH"
          export PATH="$(cygpath -u "$pip_scripts"):$PATH"
          command -v cmake && command -v aqt
          # diff 原文照抄 linux job 的 `|| 重复一次` 防抖写法，本版合并为一次：§1.3.1 这类
          # "元数据必失败"的根因重试无意义，一次干净失败更利于 continue-on-error 取证
          aqt install-qt windows desktop 6.11.1 win64_msvc2022_64 -O "$HOME/Qt"
          # 落盘目录名按 linux 侧先例（本文件 :43：arch 参数 linux_gcc_64 → 落盘 gcc_64，
          # 归一化由 Qt 包内布局决定）取 msvc2022_64；§5.1.3 注明 windows 侧归一化未逐项验证，
          # 下方自检兜底：目录不存在就列出实际结构并失败，便于取证而非后续步骤报"找不到 exe"
          qt_bin="$HOME/Qt/6.11.1/msvc2022_64/bin"
          [ -d "$qt_bin" ] || { echo "::error::Qt 落盘目录与预期不符，实际内容："; ls "$HOME/Qt/6.11.1"; exit 1; }
          echo "$qt_bin" >> "$GITHUB_PATH"

      - name: 激活 MSVC 环境
        # §5.2 第二跳：Ninja + cl 需先注入 MSVC 环境（报告§3.2 前提4）；arch x64 对齐 win64_msvc2022_64；
        # 钉 v1.13.0（上游 latest release，2024-01-01），与 checkout 钉版哲学一致
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: 配置与构建（全量放开，M2a-d 后 A 降级解除）
        shell: bash
        run: |
          set -o pipefail
          # Ninja 预装于 windows runner（报告§3.2 前提3）；万一镜像漂移则 pip 兜底（脚本目录已在 PATH）
          command -v ninja || python -m pip install --user ninja
          # 第 5 轮兜底（R3/R4 双证 run 41326068384 / 41338043587：Release 9 目标构建 exit 0 而
          # 测试 exe 全灭，tests 直下完整枚举仅 3 个 CMake 元文件）——"链接后文件被摘除"型死因
          # 未排除：windows runner 的 Defender 实时扫描隔离新落盘未签名 exe 属已知现象。对
          # workspace 与 RUNNER_TEMP 加扫描排除；命令失败不致命（::warning:: 留痕），是否真凶
          # 由本步骤尾部落盘注解与 windeployqt 步全树取证联合判定，不预设结论。
          powershell.exe -NoProfile -Command 'Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE; Add-MpPreference -ExclusionPath $env:RUNNER_TEMP' \
            || echo "::warning::Defender 扫描排除未生效，删除型死因的预防性兜底缺席"
          # §5.2 第二跳落地：-G Ninja（import std 在 MSVC 上仅 Ninja 支持，首跑 VS 生成器已在
          # run 41313929185 取证失败）；第 2 轮该配置 64s 通过（run 41320557061）——点 B 取证成功。
          # CMAKE_BUILD_TYPE=Release：aqt 在线 base 包按官方口径 release-only（无 Qt6Cored.dll；
          # Updates.xml 本机网络不可达未能直接验证，第 2 轮 --debug 部署 0 产出为旁证），
          # Debug(/MDd) exe 混 release Qt DLL 属 MSVC 不推荐组合，且 debug CRT 断言在 CI 会弹
          # 模态框挂满 300s 超时（第 2 轮 6/6 恰 300s 的候选形态之一），统一 Release 消除该类。
          # 注解取证移植自 linux job（本文件 :61-64）：日志原文网页需登录、API 需凭据，
          # ::error:: 注解是匿名可读的唯一通道
          cmake -S src -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.11.1/msvc2022_64" 2>&1 | tee /tmp/win-cfg.log | tail -3 \
            || { grep -B3 -A8 "CMake Error" /tmp/win-cfg.log | head -8 > /tmp/win-ann.txt
                 [ -s /tmp/win-ann.txt ] || tail -8 /tmp/win-cfg.log > /tmp/win-ann.txt
                 while IFS= read -r line; do echo "::error::${line:0:400}"; done < /tmp/win-ann.txt
                 exit 1; }
          # 第 8 轮放开全量：M2a-d 落账后 A 降级前提解除，9 目标白名单（原目标名实核与
          # B7 辨析注释随退役面归 git 历史，run 41477627137 前后轮次可查）整体退役，
          # cmake --build 全树构建。ninja -k 0：首轮失译也不停轮、把全部失译 TU 一轮收齐
          # ——注解是匿名取证的唯一通道（每步上限 10 条，截取 head 10），产品码修复
          # （仅限失败取证指到的文件）一轮即可对齐清单；rendezvous 零直接 POSIX 头、
          # 全走 gy_net_core（本机 grep arpa/inet.h|sys/socket.h|unistd.h 等 0 命中，
          # 2026-11-03 实证），其 win_* 占位注释（src/rendezvous/CMakeLists.txt:52）的
          # 存废由本轮编译实况裁决；Qt 模块面（Quick/QuickControls2/QuickDialogs2/Widgets，
          # src/CMakeLists.txt:29）能否由 aqt base 包满足，同样由本轮配置/编译实况回答
          cmake --build build-win -- -k 0 2>&1 | tee /tmp/win-build.log | tail -3 \
            || { grep -E "error C[0-9]+|fatal error|error:|FAILED:" /tmp/win-build.log | head -10 > /tmp/win-ann2.txt
                 while IFS= read -r line; do echo "::error::${line:0:400}"; done < /tmp/win-ann2.txt
                 exit 1; }
          # 落盘实况每轮实测（第 5 轮引入）：构建 exit 0 瞬间的 exe 计数匿名钉死
          # （::notice:: 与失败注解分属不同配额）；三分死因已由第 6 轮定案终结
          # （全树搜得=落盘他处型），此处计数保留为布局漂移的第一现场
          shopt -s nullglob globstar
          built=(build-win/tests/*.exe)
          tree=()
          for f in build-win/**/*.exe; do case "$f" in *CMakeFiles*) continue ;; esac; tree+=("$f"); done
          # 恢复垫：立即抄送一份到 workspace 外的 runner 临时盘（RUNNER_TEMP 已加入扫描排除），
          # windeployqt 步在期望路径与全树均搜不到 exe 时从这里回填。抄送对象=全树 exe：
          # 第 6 轮定案 Windows 落盘面在 build-win 顶层而非 tests 直下（见 windeployqt 步注释），
          # 只抄 tests 直下等于垫了空气——#29 实证该垫 0 个抄到、0 个动用
          rescue="$(cygpath -u "${RUNNER_TEMP:-.}" 2>/dev/null || echo "${RUNNER_TEMP:-.}")/gy-exe-rescue"
          mkdir -p "$rescue"
          for exe in "${tree[@]}"; do cp -f "$exe" "$rescue/"; done
          echo "::notice::构建 exit 0 后 exe 落盘：tests 直下计 ${#built[@]}（${built[*]:-无}）｜全树计 ${#tree[@]}｜恢复垫抄送 $(ls "$rescue" | wc -l) 个至 $rescue"
          # 第 6 轮取证：ninja 链接行的 $out 原文是生成期落盘路径的直接证据——顶层形如
          # "Linking CXX executable test_x.exe"、tests 直下形如 "…tests/test_x.exe"。绿路径
          # 也钉死，落盘面自此每轮实测、不再靠布局假设推断
          lnk="$(grep -E 'Linking CXX executable' /tmp/win-build.log 2>/dev/null | tail -9 | sed 's/^[^A-Za-z]*//' | awk 'NR>1{printf "｜"}{printf "%s",$0}')"
          if [ -n "$lnk" ]; then
            echo "::notice::[链接行实况] ninja 链接行原文（相对 build-win 的落盘路径）：${lnk:0:1800}"
          else
            echo "::notice::[链接行实况] /tmp/win-build.log 无 Linking CXX executable 行——构建系统层未链接型死因"
          fi
      - name: windeployqt 摆 DLL 与平台插件
        shell: bash
        run: |
          # 33 个测试均为 qt_add_executable，Windows 无 rpath：Qt6*.dll 与平台插件需就位（报告 B19）。
          # 第 3 轮取证（run 41326068384 / 6d519bf）：第 5 步 9 目标构建 exit 0，自检 find 计 0，
          # 判为 System32 find.exe 同名遮蔽（R2 ctest 曾把 6 exe 全拉起跑满 300s），故改 bash glob。
          # 第 4 轮取证（run 41338043587 / e748937）：glob 同样计 0——遮蔽说出局；build-win/tests
          # 完整枚举仅 3 个 CMake 元文件（head -4 只取到 3 条即全列，无 exe 无 Release 子目录），
          # 而顶层 ls 因 head -4 截断把全部小写条目折叠、证据不完整。Debug（R2）exe 在 tests 直下、
          # Release（R3/R4）全灭且构建 exit 0，单配置 Ninja 下 BuildType 不应改变布局——三分待判：
          # 构建系统层未链接 / 链接后文件被摘除 / 落盘他处。本版三管齐下（配第 5 步尾部 ::notice::
          # 落盘注解与 Defender 扫描排除，见上方构建步）：
          #  ① 布局自适应：tests 直下不足 6 时全树搜 exe（globstar，不依赖 find——第 2 轮已实证
          #     System32 find.exe 同名遮蔽）并归位到 CTestTestfile.cmake 生成期路径（全仓 grep 零
          #     OUTPUT_DIRECTORY 搬运 → 即 build-win/tests 直下），ctest 步零改动；
          #  ② 恢复垫回填：全树亦 0 时从第 5 步抄送的 RUNNER_TEMP/gy-exe-rescue 回填（摘除型实锤）；
          #  ③ 归位后仍不足 6 才失败，取证升级：顶层/tests 完整枚举（不再 head 截断）+ 全树 exe +
          #     /tmp/win-build.log 的 grep -E "Linking|\.exe$|ninja" 行注入（ninja 到底链没链 exe）。
          # 第 6 轮定案（run 41349344689 绿路径注解 × 本机静态取证，R2~R4 三分谜题终结）：
          #  Windows 落盘面由 Qt 定死，不在 tests 直下——src/CMakeLists.txt:17 的
          #  qt_standard_project_setup 在 Windows 走 Qt6CoreMacros.cmake:3643-3648：
          #  if(WIN32) 且 CMAKE_RUNTIME_OUTPUT_DIRECTORY 未设 → set(CMAKE_RUNTIME_OUTPUT_DIRECTORY
          #  ${CMAKE_CURRENT_BINARY_DIR})。qt6_standard_project_setup 是 macro（:3575）无函数
          #  作用域，set 落在调用方 src/ 的目录作用域（CMAKE_CURRENT_BINARY_DIR=build-win 顶层）
          #  且先于一切 target 创建，tests 子目录继承 → 全部 RUNTIME 产物（含 6 个测试 exe）落
          #  build-win 顶层，tests/CTestTestfile.cmake 的 add_test COMMAND 生成期同步展开为顶层
          #  绝对路径——ctest 本就从顶层拉起（Qt bin 在 PATH 上 + QT_PLUGIN_PATH 兜底，DLL 不依赖
          #  exe 旁部署）。全谱系由此自洽：R2「exe 在 tests 直下」系 Linux 布局假设的错误推定
          #  （git show b5bc0d1:src/CMakeLists.txt 实核 :17 当时即有该行，Debug 实况同在顶层）；
          #  R4「exe 全灭」实为顶层 ls head -4 截断折叠小写条目；#29 归位=把顶层 exe 复制到
          #  tests 直下（ctest 根本不读那里，冗余拷贝但不致命，job 才得以全绿）。上一轮①里
          #  「CTestTestfile 生成期路径 → 即 build-win/tests 直下」的推断只在 Linux 成立。
          #  Linux 侧走 elseif(NOT APPLE) 的 RPATH 分支（:3649），不设该变量，布局零影响
          #  （本机 build-ninja 实证：缓存无该变量、exe 在 tests 直下、CTestTestfile.cmake:7
          #  COMMAND=tests 直下绝对路径）。根治属产品构建面（于 src/CMakeLists.txt:17 之前
          #  预置 CMAKE_RUNTIME_OUTPUT_DIRECTORY 即 Qt 注释自述的官方 opt-out），无失败取证
          #  指认前不动产品码；本步改为按生成期文件推导 ctest 真实期望路径，布局再漂也自适应。
          #  第 7 轮补记：产品面 opt-out 已按上句落实——src/CMakeLists.txt 在 qt_standard_project_setup
          #  之前 if(WIN32) 预置 ${CMAKE_BINARY_DIR}/${CMAKE_INSTALL_BINDIR}（=build-win/bin/），
          #  Windows 全部 RUNTIME 产物自此落 bin/、CTestTestfile COMMAND 随之；本步推导/归位/部署
          #  逻辑保留为布局自适应防线（tests 直下、顶层、bin/ 三种布局均正确工作，沙盘已验）。
          shopt -s nullglob globstar
          rescue="$(cygpath -u "${RUNNER_TEMP:-.}" 2>/dev/null || echo "${RUNNER_TEMP:-.}")/gy-exe-rescue"
          # 第 8 轮：测试 exe 名单从硬编码 6 例切全量推导——CTestTestfile.cmake 每行
          # add_test([=[名]=] "绝对路径.exe") 的生成期展开即 ctest 真实执行路径（33 例，
          # 与全量构建面同源、随用例增删自动跟走；本机 build-ninja 生成物实测 33 行
          # add_test 各恰含 1 个引号 .exe token）；解析失败不再回退旧假设 tests 直下
          # （全量推导无名单可回退，CTestTestfile 缺失/空属构建面异常，直接报错取证）
          ctest_tf=build-win/tests/CTestTestfile.cmake
          expected=()
          while IFS= read -r tok; do
            case "$tok" in */build-win/*) expected+=("build-win/${tok#*/build-win/}") ;; esac
          done < <(grep '^add_test(' "$ctest_tf" 2>/dev/null | grep -oE '"[^"]+\.exe"' | tr -d '"' | awk '!seen[$0]++')
          if [ "${#expected[@]}" -eq 0 ]; then
            echo "::error::$ctest_tf 未解析出任何 add_test exe 路径（CTestTestfile 缺失或格式漂移）"
            exit 1
          fi
          present=0; missing=()
          for p in "${expected[@]}"; do
            if [ -f "$p" ]; then present=$((present+1)); else missing+=("$p"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            found=()
            for f in build-win/**/*.exe; do
              case "$f" in *CMakeFiles*) continue ;; esac   # 排除 CompilerIdCXX/CMakeTmp 探测产物
              found+=("$f")
            done
            if [ "${#found[@]}" -gt 0 ]; then
              healed=0
              for p in "${missing[@]}"; do
                b="$(basename "$p")"
                for f in "${found[@]}"; do
                  if [ "$(basename "$f")" = "$b" ] && [ "$f" != "$p" ]; then
                    mkdir -p "$(dirname "$p")"; cp -f "$f" "$p"; healed=$((healed+1)); break
                  fi
                done
              done
              echo "::notice::[ctest 期望路径] $ctest_tf add_test COMMAND 生成期展开（ctest 实际执行路径）：${expected[*]}"
              echo "::notice::期望路径在位仅 ${present} 个，全树搜得 ${#found[@]} 个 exe，按 ctest 期望路径归位 ${healed} 个（原先错拷到 tests 直下的冗余行为终止）：${expected[*]}"
            else
              rescued=("$rescue"/*.exe)
              if [ "${#rescued[@]}" -gt 0 ]; then
                for p in "${missing[@]}"; do
                  b="$(basename "$p")"
                  for r in "${rescued[@]}"; do
                    if [ "$(basename "$r")" = "$b" ]; then
                      mkdir -p "$(dirname "$p")"; cp -f "$r" "$p"; break
                    fi
                  done
                done
                echo "::warning::期望路径与全树均搜不到 exe——从第 5 步恢复垫回填（构建后被摘除型死因实锤，扫描排除未防住）：${expected[*]}"
              fi
            fi
            present=0   # 归位/回填后重验
            for p in "${expected[@]}"; do [ -f "$p" ] && present=$((present+1)); done
          fi
          if [ "$present" -lt "${#expected[@]}" ]; then
            echo "::error::ctest 期望路径仅见 ${present}/${#expected[@]} 个测试 exe（期望：${expected[*]}），构建产物布局异常"
            link_cnt=$(grep -cE "Linking|\.exe$|ninja" /tmp/win-build.log 2>/dev/null)
            exe_cnt=$(grep -c "CXX executable" /tmp/win-build.log 2>/dev/null)
            tree=()
            for f in build-win/**/*.exe; do case "$f" in *CMakeFiles*) continue ;; esac; tree+=("$f"); done
            { echo "[顶层完整] build-win: $(ls build-win 2>&1 | tr '\n' ' ')｜[tests完整] build-win/tests: $(ls build-win/tests 2>&1 | tr '\n' ' ')"
              echo "[ctest期望共${#expected[@]}例] ${expected[*]}"
              echo "[全树exe] /tmp/win-build.log 中 Linking|\.exe$|ninja 行计 ${link_cnt:-日志缺失}（CXX executable 行计 ${exe_cnt:-0}）｜build-win/**/*.exe（除 CMakeFiles）计 ${#tree[@]}：${tree[*]:-无匹配}"
              echo "[恢复垫] $rescue: $(ls "$rescue" 2>/dev/null | wc -l) 个"
              grep -nE "Linking|\.exe$|ninja" /tmp/win-build.log 2>/dev/null | tail -5 | sed 's/^/[ninja日志] /'
            } 2>&1 | while IFS= read -r line; do echo "::error::${line:0:600}"; done
            exit 1
          fi
          # 部署对象=expected[]（ctest 实际执行的路径）：#29 时 DLL 摆在 tests 直下而 ctest
          # 从顶层跑 exe，靠 Qt bin 在 PATH 上侥幸全绿——部署面自此对准真实执行路径
          for exe in "${expected[@]}"; do
            "$HOME/Qt/6.11.1/msvc2022_64/bin/windeployqt.exe" --release --no-translations "$exe" \
              || echo "::warning::windeployqt 失败（QT_PLUGIN_PATH 兜底仍在）：$exe"
          done
          # offscreen 平台插件不在 windeployqt 默认部署面（§5.1.6 未实测项），显式补齐到各 exe 目录
          for exe in "${expected[@]}"; do
            mkdir -p "$(dirname "$exe")/platforms"
            cp -f "$HOME/Qt/6.11.1/msvc2022_64/plugins/platforms/qoffscreen.dll" "$(dirname "$exe")/platforms/" \
              || echo "::warning::qoffscreen.dll 拷贝失败：$exe（QT_PLUGIN_PATH 兜底仍在）"
          done
          # 部署自检：任一测试 exe 目录缺 Qt6Core.dll 即失败——第 2 轮的静默空转不允许再发生。
          # 旧版 find|while 的 exit 1 只退出管道子 shell，改为 for 主 shell 真退出
          for exe in "${expected[@]}"; do
            [ -f "$(dirname "$exe")/Qt6Core.dll" ] || { echo "::error::$(dirname "$exe") 缺 Qt6Core.dll，DLL 部署未生效"; exit 1; }
          done

      - name: 串行 ctest（严禁 -j：UDP 45678 串扰，同顶部 linux job 注释）
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -o pipefail
          # §5.1.6 预案的插件兜底：即使 windeployqt 漏部署，也从 aqt 安装树直取平台插件
          export QT_PLUGIN_PATH="$HOME/Qt/6.11.1/msvc2022_64/plugins"
          # 第 8 轮放开全量 33 例（与全量构建面同源）：-R 六例过滤随 9 目标白名单退役，
          # 报告 B20 的「网络类待 A 解除后纳入」就此兑现；超时口径由 set_tests_properties
          # 自带（本机 build-ninja 生成物实测 33 例中 32 例带 TIMEOUT 300/600/60/30，仅
          # test_backup 无 TIMEOUT 走 ctest 默认 1500s），无需 --timeout 兜底；
          # 串行依据 protocol.h:44 kDefaultDiscoveryPort=45678 + 8 个绑定 UDP 的用例
          # （报告 B18、§5.1.7），沿用 ctest 默认串行，绝不加 -j；
          # 失败时逐例状态（Passed/Failed/Timeout/Not Run）注入 ::error:: 注解——第 2 轮
          # exit 8 无任何用例名可读，本注解让下轮死因匿名可读（本机实测 ctest 失败退出码=8）
          ctest --test-dir build-win --output-on-failure 2>&1 | tee /tmp/win-ctest.log | tail -8 \
            || { grep -E "Passed|Failed|Timeout|Not Run|tests passed|tests failed" /tmp/win-ctest.log \
                   | head -10 > /tmp/win-ann3.txt
                 while IFS= read -r line; do echo "::error::${line:0:400}"; done < /tmp/win-ann3.txt
                 exit 1; }
          # TODO(尖兵)：网络类用例（test_discovery/file_transfer/session_manager/relay_chain 等）
          # 的 Windows 运行时表现即 M2a-d 分支的首次真取证；转绿后按实测放宽超时（报告 B21）

      - name: 守卫（windows 可跑部分）
        env:
          PYTHONUTF8: "1"   # 脚本输出含 ✅/❌ 与中文，Windows 管道 cp1252/cp936 会 UnicodeEncodeError（报告 B17）
        shell: bash
        run: |
          # check_versions 纯 stdlib（报告 B16）、check_code_style 纯 stdlib 正则（报告 B17）→ 直跑
          python src/scripts/check_versions.py
          python src/scripts/check_code_style.py
          # 降级：--compile-check 字面调用 g++（src/scripts/check_core_isolation.py:233，报告 B14，
          # windows runner 无 g++ → FileNotFoundError），windows 侧只跑扫描防线并保持 --strict；
          # 防线5 ldd/nm（:302,310）检查的是 build-ninja/rendezvous/gridyard_rendezvous，
          # 本 job 构建目录是 build-win → 自动 SKIP 不误报（报告 B15）
          python src/scripts/check_core_isolation.py --core-dirs src/core src/shared/net/core --strict
          # TODO：choco install mingw 后恢复 --compile-check，或把该层参数化编译器后放开

  # 打包 job 占位：windows-build-and-test 转绿后再启用。打包器选型已定 Inno Setup（报告§四）：
  # GitHub Windows runner 镜像预装 InnoSetup 6.7.1（Windows2025-Readme.md 实抓），届时直接调
  # iscc 零第三方 action 零 choco 步骤；仓库现无任何 .iss 资产（§5.1.9），需新建
  package-windows:
    if: false
    runs-on: windows-2022
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
      # TODO(Inno Setup)：
      #  1) cmake --build build-win --config Release + cmake --install build-win --prefix staging
      #     （install 规则现成：appGridYard → src/client/CMakeLists.txt:210-213，
      #      gridyard_rendezvous → src/rendezvous/CMakeLists.txt:55-57）
      #  2) windeployqt staging/bin/appGridYard.exe
      #  3) ISCC.exe 编译安装包（runner 预装 InnoSetup 6.7.1，报告§四；仓库现无 .iss 脚本，需新建）
      #  4) actions/upload-artifact 上传 GridYard-<ver>-setup.exe
      #  另按报告§四登记：未签名安装器首发必弹 SmartScreen 告警，打包器无法消除，须如实写入文档
      - name: TODO Inno Setup 打包占位
        shell: bash
        run: echo "placeholder — 待 windows-build-and-test 转绿后实装"
